//
// Get job

// /job/{job_id} returns an array of jobs
// filtered by provided job_id, resulting in an
// array of one job entry when a matching job is found.
// If multiple clusters were on the same slurm instance
// /job/{job_id} could return multiple jobs but that is
// not how our systems are setup

message JobIdReq {
  string job_id = 1 [json_name = "job_id"]; // @gotags: validate:"numeric,gt=0,lt=10"
}

message JobIdResp {
  MetaResp meta = 1;
  repeated ErrorResp errors = 2;
  repeated WarningResp warnings = 3;
  repeated SlurmDBJobDescription jobs = 4;
}

message SlurmDBJobDescription {
  message Array {
    message Limits {
      message Max {
        message Running {
          int32 tasks = 1;
        }

        Running running = 1;
      }

      Max max = 1;
    }

    int32 job_id = 1 [json_name = "job_id"];
    Uint32NoVal task_id = 2 [json_name = "task_id"];
    string task = 3;
    Limits limits = 4;
  }

  message Association {
    string account = 1;
    string cluster = 2;
    string partition = 3;
    string user = 4;
    int32 id = 5;
  }

  message Comment {
    string administrator = 1;
    string job = 2;
    string system = 3;
  }

  message HET {
    int32 job_id = 1 [json_name = "job_id"];
    Uint32NoVal job_offset = 2 [json_name = "job_offset"];
  }

  message Time {
    int32 elapsed = 1;
    int64 start = 2;
    int64 end = 3;
    int32 suspended = 4;
    Uint64NoVal planned = 5;
  }

  message Required {
    int32 CPUs = 1 [json_name = "CPUs"];
    Uint64NoVal memory_per_cpu = 2 [json_name = "memory_per_cpu"];
    Uint64NoVal memory_per_node = 3 [json_name = "memory_per_node"];
  }

  message Reservation {
    int32 id = 1;
    string name = 2;
  }

  message State {
    repeated string current = 1;
    string reason = 2;
  }

  message Step {
    message Nodes {
      int32 count = 1;
      string range = 2;
      repeated string list = 3;
    }

    message Tasks {
      int32 count = 1;
    }

    message CPU {
      message RequestedFrequency {
        Uint32NoVal min = 1;
        Uint32NoVal max = 2;
      }

      RequestedFrequency requested_frequency = 1 [json_name = "requested_frequency"];
      string governor = 2;
    }

    message StepInfo {
      string id = 1;
      string name = 2;
    }

    message Task {
      string distribution = 1;
    }

    message StepTime {
      int32 elapsed = 1;
      Uint64NoVal end = 2;
      Uint64NoVal start = 3;
      int32 suspended = 4;
    }

    StepTime time = 1;
    ProcessExitCodeVerbose exit_code = 2 [json_name = "exit_code"];
    Nodes nodes = 3;
    Tasks tasks = 4;
    CPU cpu = 5 [json_name = "CPU"];
    string kill_request_user = 6 [json_name = "kill_request_user"];
    repeated string state = 7;
    StepInfo step = 8 [json_name = "step"];
    Task task = 9;
  }

  string account = 1;
  Comment comment = 2;
  int32 allocation_nodes = 3 [json_name = "allocation_nodes"];
  Array array = 4;
  Association association = 5;
  string block = 6;
  string cluster = 7;
  string constraints = 8;
  string container = 9;
  ProcessExitCodeVerbose derived_exit_code = 10 [json_name = "derived_exit_code"];
  Time time = 11;
  ProcessExitCodeVerbose exit_code = 12 [json_name = "exit_code"];
  string extra = 13;
  string failed_node = 14 [json_name = "failed_node"];
  repeated string flags = 15;
  string group = 16;
  HET het = 17;
  int32 job_id = 18 [json_name = "job_id"];
  string name = 19;
  string licenses = 20;
  string nodes = 21;
  string partition = 22;
  bool hold = 23;
  Uint32NoVal priority = 24;
  string qos = 25;
  string qosreq = 26;
  Required required = 27;
  string kill_request_user = 28 [json_name = "kill_request_user"];
  int32 restart_cnt = 29 [json_name = "restart_cnt"];
  Reservation reservation = 30;
  string script = 31;
  string stdin_expanded = 32 [json_name = "stdin_expanded"];
  string stdout_expanded = 33 [json_name = "stdout_expanded"];
  string stderr_expanded = 34 [json_name = "stderr_expanded"];
  string stdout = 35;
  string stderr = 36;
  string stdin = 37;
  State state = 38;
  repeated Step steps = 39;
  string submit_line = 40 [json_name = "submit_line"];
  string used_gres = 42 [json_name = "used_gres"];
  string user = 43;
  string working_directory = 45 [json_name = "working_directory"];
}

//
// Post job submit

message JobSubmitReq {
  message JobDescription {
    message Crontab {
      string minute = 1;
      string hour = 2;
      string day_of_month = 3 [json_name = "day_of_month"];
      string month = 4;
      string day_of_week = 5 [json_name = "day_of_week"];
      string specification = 6;
      string command = 7;
    }

    message RLimits {
      Uint64NoVal cpu = 1;
      Uint64NoVal fsize = 2;
      Uint64NoVal data = 3;
      Uint64NoVal stack = 4;
      Uint64NoVal core = 5;
      Uint64NoVal rss = 6;
      Uint64NoVal nproc = 7;
      Uint64NoVal nofile = 8;
      Uint64NoVal memlock = 9;
      Uint64NoVal as = 10;
    }

    string account = 1;
    Uint64NoVal begin_time = 9 [json_name = "begin_time"];
    optional string comment = 14;
    repeated string environment = 28;
    optional string licenses = 38;
    string name = 45;
    optional int32 tasks = 48;
    string partition = 53;
    Uint32NoVal distribution_plane_size = 54 [json_name = "distribution_plane_size"];
    Uint32NoVal priority = 57;
    optional string qos = 59;
    optional string reservation = 63;
    string script = 64;
    Uint32NoVal time_limit = 69 [json_name = "time_limit"];
