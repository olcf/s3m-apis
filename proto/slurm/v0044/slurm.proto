syntax = "proto3";

package olcf.s3m.slurm.v0044;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "proto/common/v1alpha/headers.proto";

option go_package = "github.com/olcf/s3m-apis/slurm/v0044;slurmv0044pb";

//
// API

service SlurmIndirect {
  option (common.v1alpha.service_header_param) = {
    header: "olcf-resource"
    param_name: "compute_resource"
    required: true
  };

  rpc Ping(google.protobuf.Empty) returns (PingResp) {
    option (google.api.http) = {
      get: "/slurm/v0.0.44/ping"
    };
  }
  rpc GetDiag(google.protobuf.Empty) returns (DiagResp) {
    option (google.api.http) = {
      get: "/slurm/v0.0.44/diag"
    };
  }
  rpc GetJob(JobIdReq) returns (JobIdResp) {
    option (google.api.http) = {
      get: "/slurm/v0.0.44/job/{job_id}"
    };
  }
  rpc GetJobs(google.protobuf.Empty) returns (JobsResp) {
    option (google.api.http) = {
      get: "/slurm/v0.0.44/jobs"
    };
  }
  rpc PostJobSubmit(JobSubmitReq) returns (JobSubmitResp) {
    option (google.api.http) = {
      post: "/slurm/v0.0.44/job/submit"
      body: "*"
    };
    option (common.v1alpha.method_header_param) = {
      header: "x-s3m-withstorage"
      param_name: "with_storage"
      required: false
    };
  }
  rpc DeleteJob(DeleteJobReq) returns (DeleteJobResp) {
    option (google.api.http) = {
      delete: "/slurm/v0.0.44/job/{job_id}"
    };
  }
  rpc GetNodes(google.protobuf.Empty) returns (NodesResp) {
    option (google.api.http) = {
      get: "/slurm/v0.0.44/nodes"
    };
  }
  rpc GetPartitions(google.protobuf.Empty) returns (PartitionsResp) {
    option (google.api.http) = {
      get: "/slurm/v0.0.44/partitions"
    };
  }
  rpc GetReservations(google.protobuf.Empty) returns (ReservationsResp) {
    option (google.api.http) = {
      get: "/slurm/v0.0.44/reservations"
    };
  }
}

//
// Shared messages

message ErrorResp {
  int32 error_number = 1 [json_name = "error_number"];
  string error = 2;
  string source = 3;
  string description = 4;
}

message WarningResp {
  string warning = 1;
  string source = 2;
  string description = 3;
}

message Int32NoVal {
  bool set = 1;
  bool infinite = 2;
  int32 number = 3;
}

message Int64NoVal {
  bool set = 1;
  bool infinite = 2;
  int64 number = 3;
}

message Uint16NoVal {
  bool set = 1;
  bool infinite = 2;
  uint32 number = 3;
}

message Uint32NoVal {
  bool set = 1;
  bool infinite = 2;
  uint32 number = 3;
}

message Uint64NoVal {
  bool set = 1;
  bool infinite = 2;
  uint64 number = 3;
}

message Float32NoVal {
  bool set = 1;
  bool infinite = 2;
  float number = 3;
}

message Float64NoVal {
  bool set = 1;
  bool infinite = 2;
  double number = 3;
}

message ExitCode {
  repeated string status = 1;
  Uint32NoVal return_code = 2 [json_name = "return_code"];
  Signal signal = 3;
}

message Signal {
  Uint32NoVal id = 1;
  string name = 2;
}

message ProcessSignalVerbose {
  Uint16NoVal id = 1;
  string name = 2;
}

message ProcessExitCodeVerbose {
  repeated string status = 1;
  Uint32NoVal return_code = 2 [json_name = "return_code"];
  ProcessSignalVerbose signal = 3;
}

//
// Metadata

message MetaResp {
  MetaPluginResp plugin = 1;
  MetaSlurmResp slurm = 2;
  MetaClientResp client = 3;
}

message MetaPluginResp {
  string type = 1;
  string name = 2;
  string data_parser = 3 [json_name = "data_parser"];
}

message MetaSlurmResp {
  MetaSlurmVersionResp version = 1;
  string release = 2;
}

message MetaSlurmVersionResp {
  string major = 1;
  string minor = 2;
  string micro = 3;
}

message MetaClientResp {
  string source = 1;
}

